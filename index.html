<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✏️ 검색엔진·카톡 공유용 정보: 내 사이트에 맞게 바꿔주세요 (JS가 아니라 여기 적어야 미리보기에 반영돼요) -->
  <title>나의 공부 노트 | 개념 정리 + 문제 풀이</title>
  <meta name="description" content="초보자도 이해되는 개념 정리와 문제 풀이. 회원가입 없이 바로 시작, 북마크로 복습까지.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="나의 공부 노트">
  <meta property="og:description" content="개념 정리 + 문제 풀이 + 오답노트">
  <meta property="og:locale" content="ko_KR">
  <!-- 공유 이미지(권장 1200x630)를 assets/og-image.png 로 넣고 아래 주소를 내 사이트 주소로 바꾸세요 -->
  <meta property="og:image" content="https://YOUR-ID.github.io/YOUR-REPO/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="목차 열기">☰</button>
    <a class="brand" href="#guide">
      <span class="brand-dot"></span>
      <span id="brand"></span>
      <small id="brandSub"></small>
    </a>
    <nav class="tabs" id="tabs">
      <a href="#guide" data-tab="guide">스터디 가이드</a>
      <a href="#quiz" data-tab="quiz"><span class="tab-label"></span> <span class="cnt"></span></a>
      <a href="#ox" data-tab="ox"><span class="tab-label"></span> <span class="cnt"></span></a>
      <a href="#wrong" data-tab="wrong">오답노트 <span class="cnt"></span></a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="다크/라이트 전환">◐</button>
  </header>

  <!-- 왼쪽 목차 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-title">목차</div>
    <nav id="toc" class="toc"></nav>

    <div class="side-title">🔖 북마크</div>
    <ul id="bookmarkList" class="bm-list"></ul>

    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main>
    <div class="container">
      <!-- 가이드 탭 -->
      <section class="tab-panel" id="tab-guide">
        <div id="hero"></div>
        <div id="chapters"><p class="loading">불러오는 중…</p></div>
      </section>

      <!-- 문제 풀이 탭 -->
      <section class="tab-panel" id="tab-quiz">
        <div class="panel-head" id="quizHead"></div>
        <div id="quizRoot"></div>
      </section>

      <!-- OX 탭 -->
      <section class="tab-panel" id="tab-ox">
        <div class="panel-head" id="oxHead"></div>
        <div id="oxRoot"></div>
      </section>

      <!-- 오답노트 탭 -->
      <section class="tab-panel" id="tab-wrong">
        <div class="panel-head">
          <h2>오답노트 <small>틀린 문제 모아보기</small></h2>
          <p>문제 풀이와 OX에서 틀린 문제가 여기에 모여요. 다시 풀어서 맞히면 목록에서 사라집니다.</p>
        </div>
        <div id="wrongList"></div>
      </section>

      <footer class="footer" id="footer"></footer>
    </div>
  </main>

  <!-- 업데이트 내역 팝업 -->
  <dialog id="updDlg" class="dlg">
    <div class="dlg-head"><strong>업데이트 내역</strong><button class="icon-btn" id="updClose" aria-label="닫기">✕</button></div>
    <div id="updBody" class="dlg-body"></div>
  </dialog>

  <!-- 순서 중요: 설정 → 데이터 → 라이브러리 → 앱 -->
  <script src="config.js"></script>
  <script src="data/quiz.js"></script>
  <script src="data/ox.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
